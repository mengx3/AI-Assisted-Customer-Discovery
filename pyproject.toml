[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer_discovery"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0","numpy>=1.25","scikit-learn>=1.3","matplotlib>=3.8","joblib>=1.3","openpyxl>=3.1"]

[tool.setuptools.packages.find]
include = ["customer_discovery*"]
